<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wee Sports · Bowling</title></head>
  <body>
    <main id="bowling-app">
      <div id="lane" aria-label="Bowling lane"></div>
      <aside class="match-hud bowling-hud" aria-label="Bowling scoreboard">
        <header class="bowling-heading match-hud__heading">
          <h1>Scorecard</h1>
          <span id="frame-label" class="bowling-pill">10 frames</span>
        </header>
        <ol id="score-totals" class="bowling-standings" aria-label="Current scores"></ol>
        <div class="bowling-hud__footer"><p id="roll-status" role="status">Preparing the lane…</p><button id="open-scorecard" type="button" aria-haspopup="dialog">Full scorecard</button></div>
      </aside>
      <dialog id="scorecard-dialog" class="bowling-scorecard-dialog" aria-labelledby="scorecard-title">
        <header><h2 id="scorecard-title">Ten-frame scorecard</h2><button id="close-scorecard" type="button">Close</button></header>
        <div class="bowling-scores" tabindex="0" role="region" aria-label="Ten-frame bowling scorecard. Scroll horizontally on smaller screens."><table aria-label="Bowling scorecard"><thead><tr id="score-head"><th scope="col">Player</th></tr></thead><tbody id="score-body"></tbody></table></div>
        <p class="scorecard-help">X strike · / spare · … bonus pending</p>
      </dialog>
      <section id="roll-callout" class="bowling-callout" role="status" aria-live="polite" hidden><span id="callout-player"></span><strong id="callout-title"></strong><p id="callout-detail"></p></section>
      <section id="results" class="bowling-results game-result-card" role="status" aria-live="polite" hidden>
        <div class="game-result-emblem" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h12v7c0 5-2.5 8-6 8s-6-3-6-8V5Zm0 2H5v4c0 4 3 6 6 6m11-10h5v4c0 4-3 6-6 6M16 20v6m-5 2h10"/></svg></div>
        <p class="result-eyebrow" id="result-label">Ten frames complete</p><h2 id="result-winner"></h2><p class="game-result-score" id="result-score"></p>
        <ol id="ranking"></ol><p class="game-result-replay" id="replay-prompt"></p><button id="replay" type="button">Play again</button>
      </section>
      <section id="local-controls" hidden><h2>Your delivery</h2><div class="bowling-controls"><label>Aim <input id="aim" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Curve <input id="spin" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Power <input id="power" type="range" min="0" max="1" step="0.01" value="0.65"></label><button id="roll" type="button">Roll ball</button><button id="practice" type="button">Practice a fresh rack</button></div></section>
      <aside class="bowling-aim" id="aim-hud" aria-label="Live bowling aim">
        <div class="bowling-aim__heading"><span id="aim-label">Aim · centre</span><span class="bowling-aim__state" id="aim-state">Live</span></div>
        <div class="bowling-aim__track" aria-hidden="true"><span class="bowling-aim__marker"></span></div>
        <p class="bowling-help" id="help">Tilt to aim. Swing forward to bowl.</p>
      </aside>
    </main>
    <script type="module" src="/src/bowlingMain.ts"></script>
  </body>
</html>
