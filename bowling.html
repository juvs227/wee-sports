<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wee Sports · Bowling</title></head>
  <body>
    <main id="bowling-app">
      <div id="lane" aria-label="Bowling lane"></div>
      <aside class="match-hud bowling-hud" aria-label="Bowling scoreboard">
        <header class="bowling-heading match-hud__heading">
          <h1>Scorecard</h1>
          <span id="frame-label" class="bowling-pill">10 frames</span>
        </header>
        <div class="bowling-scores" tabindex="0" role="region" aria-label="Ten-frame bowling scorecard. Scroll horizontally on smaller screens."><table aria-label="Bowling scorecard"><thead><tr id="score-head"><th scope="col">Player</th></tr></thead><tbody id="score-body"></tbody></table></div>
        <div class="bowling-hud__footer"><p id="roll-status" role="status">Preparing the lane…</p><p class="scorecard-help">X strike · / spare · … bonus pending</p></div>
      </aside>
      <section id="roll-callout" class="bowling-callout" role="status" aria-live="polite" hidden><span id="callout-player"></span><strong id="callout-title"></strong><p id="callout-detail"></p></section>
      <section id="results" class="bowling-results" hidden><h2>Match complete</h2><ol id="ranking"></ol><button id="replay" type="button">Play again</button></section>
      <section id="local-controls" hidden><h2>Your delivery</h2><div class="bowling-controls"><label>Aim <input id="aim" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Curve <input id="spin" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Power <input id="power" type="range" min="0" max="1" step="0.01" value="0.65"></label><button id="roll" type="button">Roll ball</button></div></section>
      <p class="bowling-help" id="help">Aim on your phone and roll when it is your turn.</p>
    </main>
    <script type="module" src="/src/bowlingMain.ts"></script>
  </body>
</html>
