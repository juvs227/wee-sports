<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Three.js Project</title>
    <link rel="stylesheet" href="./src/Overlay/css/pause.css" />
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <button id="pause-btn" aria-label="Pause">
      <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
      <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <polygon points="7,4 20,12 7,20" />
      </svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
