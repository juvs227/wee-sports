<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Phone Orientation</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; color: #eee; font-family: system-ui, sans-serif; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100dvh; }
h2 { font-size: 14px; color: #555; text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; }
#enable { padding: 14px 32px; font-size: 18px; border-radius: 10px; border: none; background: #f90; color: #000; font-weight: bold; cursor: pointer; }
#status { font-size: 12px; color: #555; }
#status.ok { color: #4f4; }
#status.err { color: #f44; }
.vals { font-size: 12px; color: #666; font-variant-numeric: tabular-nums; line-height: 1.8; text-align: center; }
.vals b { color: #aaa; }
canvas { border-radius: 8px; background: #111; display: block; }
.panel { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }

#cal-btn  { display: none; padding: 12px 28px; font-size: 16px; border-radius: 10px; border: 2px solid #4cf; background: transparent; color: #4cf; font-weight: bold; cursor: pointer; }
#cal-btn:active  { background: #0a2030; }
</style>
</head>
<body>
<button id="enable">Enable Sensors</button>
<div id="status">waiting…</div>

<button id="cal-btn">Calibrate — face the net</button>

<div class="panel">
  <h2>Screen Normal Vector</h2>
  <canvas id="phone3d" width="320" height="240"></canvas>
  <div class="vals" id="vals">
    <div>quaternion: <b id="qval">—</b></div>
    <div>normal: <b id="nval">—</b></div>
    <div>azimuth: <b id="azval">—</b> &nbsp; elevation: <b id="elval">—</b></div>
  </div>
</div>

<div class="panel">
  <h2>Launch Parabola</h2>
  <canvas id="parabola" width="320" height="200"></canvas>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ── Math helpers ──────────────────────────────────────────────────────────────
function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function normalize(v) { const l = Math.hypot(...v); return l ? v.map(x => x/l) : v; }

// Rotate vector v by quaternion q = [x,y,z,w]
function qrot(q, v) {
  const [qx,qy,qz,qw] = q;
  const [vx,vy,vz] = v;
  const tx = 2*(qy*vz - qz*vy);
  const ty = 2*(qz*vx - qx*vz);
  const tz = 2*(qx*vy - qy*vx);
  return [
    vx + qw*tx + qy*tz - qz*ty,
    vy + qw*ty + qz*tx - qx*tz,
    vz + qw*tz + qx*ty - qy*tx,
  ];
}

// Euler (deviceorientationabsolute) → screen normal in ENU world
function eulerToNormal(alpha, beta, gamma) {
  const a = alpha * Math.PI/180;
  const b = beta  * Math.PI/180;
  const g = gamma * Math.PI/180;
  // W3C rotation matrix column 3 = screen normal in world (ENU: x=E, y=N, z=Up)
  return [
    -Math.cos(a)*Math.sin(g) + Math.cos(g)*Math.sin(a)*Math.sin(b),
     Math.sin(a)*Math.sin(g) + Math.cos(a)*Math.cos(g)*Math.sin(b),
     Math.cos(b)*Math.cos(g),
  ];
}

// ── Camera projection setup (oblique fixed viewpoint) ────────────────────────
const CAM   = normalize([1, -1.2, 1.4]);
const CAM_R = normalize(cross(CAM, [0,0,1]));
const CAM_U = normalize(cross(CAM_R, CAM));

function project(v, scale, cx, cy) {
  return { x: dot(v, CAM_R)*scale + cx, y: -dot(v, CAM_U)*scale + cy };
}

// ── Draw 3D phone with screen normal arrow ───────────────────────────────────
function drawPhone(canvas, normal, quat) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const scale = 70, cx = W/2, cy = H/2;

  // Phone geometry in device space (z=0 is screen, z=-0.15 is back)
  const pw = 0.45, ph = 0.9, pd = 0.07;
  const deviceVerts = [
    [-pw, -ph, 0], [pw, -ph, 0], [pw, ph, 0], [-pw, ph, 0],  // front face
    [-pw, -ph,-pd],[pw, -ph,-pd],[pw, ph,-pd],[-pw, ph,-pd],  // back face
  ];

  // We display the phone in a "neutral" device orientation for the model,
  // but we draw the arrow in the direction the normal actually points in world.
  const verts = deviceVerts.map(v => project(v, scale, cx, cy));

  // Back face
  ctx.beginPath();
  ctx.moveTo(verts[4].x, verts[4].y);
  for (let i = 5; i < 8; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Side edges
  ctx.strokeStyle = '#333';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(verts[i].x, verts[i].y);
    ctx.lineTo(verts[i+4].x, verts[i+4].y);
    ctx.stroke();
  }

  // Front face (screen)
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
  ctx.fillStyle = '#1e3a5f';
  ctx.fill();
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Screen inner glow
  const inner = deviceVerts.map(v => [v[0]*0.8, v[1]*0.85, v[2]]).slice(0,4).map(v => project(v, scale, cx, cy));
  ctx.beginPath();
  ctx.moveTo(inner[0].x, inner[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(inner[i].x, inner[i].y);
  ctx.closePath();
  ctx.fillStyle = '#0d2a45';
  ctx.fill();

  // Normal vector arrow — rotated into world space and projected back to our camera
  // normal is already in ENU world. We want to show it from the phone center.
  // We project the normal vector using the same camera but we show it as world-space direction.
  // Map ENU → "world display space" for our camera: ENU (x=E, y=N, z=Up)
  // Our camera just looks at world space, so we directly project the normal as a direction.
  const arrowLen = 0.75;
  const tip = project(normal.map(n => n*arrowLen), scale, cx, cy);
  const tail = project([0, 0, 0], scale, cx, cy);

  // Arrow line
  ctx.beginPath();
  ctx.moveTo(tail.x, tail.y);
  ctx.lineTo(tip.x, tip.y);
  ctx.strokeStyle = '#ff6b35';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Arrowhead
  const dx = tip.x - tail.x, dy = tip.y - tail.y;
  const len = Math.hypot(dx, dy);
  if (len > 1) {
    const ux = dx/len, uy = dy/len;
    const hx = tip.x - ux*14, hy = tip.y - uy*14;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(hx - uy*7, hy + ux*7);
    ctx.lineTo(hx + uy*7, hy - ux*7);
    ctx.closePath();
    ctx.fillStyle = '#ff6b35';
    ctx.fill();
  }

  // Labels
  ctx.fillStyle = '#ff6b35';
  ctx.font = '12px system-ui';
  ctx.fillText('normal', tip.x + 6, tip.y - 4);

  // Compass indicator (top-right corner)
  const compR = 28, compX = W - 40, compY = 36;
  ctx.beginPath();
  ctx.arc(compX, compY, compR, 0, Math.PI*2);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.fill();

  // N/E markers
  ctx.fillStyle = '#555';
  ctx.font = '9px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('N', compX, compY - compR + 10);
  ctx.fillText('E', compX + compR - 6, compY + 3);

  // Azimuth arrow on compass
  const az = Math.atan2(normal[0], normal[1]); // atan2(E, N)
  ctx.beginPath();
  ctx.moveTo(compX, compY);
  ctx.lineTo(compX + Math.sin(az)*compR*0.8, compY - Math.cos(az)*compR*0.8);
  ctx.strokeStyle = '#ff6b35';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Elevation arc (bottom-right)
  const elX = W - 40, elY = H - 40;
  const elR = 24;
  const el = Math.asin(Math.max(-1, Math.min(1, normal[2])));
  ctx.beginPath();
  ctx.arc(elX, elY, elR, Math.PI, 0, false); // semicircle top
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(elX, elY);
  ctx.lineTo(elX + Math.cos(el - Math.PI/2)*elR*0.9, elY - Math.sin(el - Math.PI/2)*elR*0.9);
  ctx.strokeStyle = '#4cf';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#555';
  ctx.font = '9px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('el', elX, elY + 12);

  ctx.textAlign = 'left'; // reset
}

// ── Draw launch parabola ──────────────────────────────────────────────────────
function drawParabola(canvas, normal) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const g = 9.8, v0 = 12; // m/s launch speed
  const el = Math.asin(Math.max(-1, Math.min(1, normal[2])));
  const elDeg = el * 180 / Math.PI;

  const PAD = { l: 32, r: 16, t: 20, b: 36 };
  const pw = W - PAD.l - PAD.r;
  const ph = H - PAD.t - PAD.b;

  // Compute arc (even if angle ≤ 0, show flat)
  const angle = Math.max(0, el);
  const range = angle > 0.01 ? v0*v0 * Math.sin(2*angle) / g : v0*0.3;
  const maxH  = v0*v0 * Math.sin(angle)**2 / (2*g);
  const tFlight = 2*v0*Math.sin(angle)/g || 0.5;

  const N = 80;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = (i/N) * tFlight;
    const x = v0*Math.cos(angle)*t;
    const y = v0*Math.sin(angle)*t - 0.5*g*t*t;
    pts.push([x, Math.max(0, y)]);
  }

  // Scale to canvas
  const xMax = Math.max(range * 1.05, 1);
  const yMax = Math.max(maxH * 1.3, 1);
  function toCanvas(x, y) {
    return [PAD.l + (x/xMax)*pw, PAD.t + ph - (y/yMax)*ph];
  }

  // Ground
  ctx.beginPath();
  ctx.moveTo(PAD.l, PAD.t + ph);
  ctx.lineTo(PAD.l + pw, PAD.t + ph);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Optimal angle guide (45°)
  if (angle < Math.PI/4 - 0.05 || angle > Math.PI/4 + 0.05) {
    const optRange = v0*v0/g;
    const optH = v0*v0/(4*g);
    const optPts = [];
    const tOpt = v0*Math.SQRT2/g;
    for (let i = 0; i <= 40; i++) {
      const t = (i/40)*tOpt;
      const x = v0/Math.SQRT2*t;
      const y = v0/Math.SQRT2*t - 0.5*g*t*t;
      const [cx2, cy2] = toCanvas(x, Math.max(0,y));
      optPts.push([cx2, cy2]);
    }
    ctx.beginPath();
    ctx.moveTo(optPts[0][0], optPts[0][1]);
    for (const [px,py] of optPts.slice(1)) ctx.lineTo(px, py);
    ctx.strokeStyle = '#2a4a2a';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Trajectory
  if (pts.length) {
    ctx.beginPath();
    const [sx, sy] = toCanvas(pts[0][0], pts[0][1]);
    ctx.moveTo(sx, sy);
    for (const [x,y] of pts.slice(1)) {
      const [cx2, cy2] = toCanvas(x, y);
      ctx.lineTo(cx2, cy2);
    }
    const grad = ctx.createLinearGradient(PAD.l, 0, PAD.l + pw, 0);
    grad.addColorStop(0, '#ff6b35');
    grad.addColorStop(1, '#ff6b3566');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Launch point dot
  const [lx, ly] = toCanvas(0, 0);
  ctx.beginPath();
  ctx.arc(lx, ly, 5, 0, Math.PI*2);
  ctx.fillStyle = '#ff6b35';
  ctx.fill();

  // Angle label
  ctx.fillStyle = el < 0 ? '#f44' : '#aaa';
  ctx.font = '12px system-ui';
  ctx.fillText(`${elDeg.toFixed(1)}°`, lx + 8, ly - 8);

  // Range label
  if (range > 0.1) {
    const [rx, ry] = toCanvas(range, 0);
    ctx.fillStyle = '#555';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${range.toFixed(1)}m`, rx, ry + 14);
  }

  // Aim direction (top-down mini view, top-left)
  const aimR = 22, aimX = PAD.l + 26, aimY = PAD.t + 26;
  ctx.beginPath();
  ctx.arc(aimX, aimY, aimR, 0, Math.PI*2);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();
  const az = Math.atan2(normal[0], normal[1]);
  ctx.beginPath();
  ctx.moveTo(aimX, aimY);
  ctx.lineTo(aimX + Math.sin(az)*aimR*0.85, aimY - Math.cos(az)*aimR*0.85);
  ctx.strokeStyle = '#4cf';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#555';
  ctx.font = '8px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('aim', aimX, aimY + aimR + 10);

  // Axes labels
  ctx.fillStyle = '#333';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('↑ height (m)', 2, PAD.t + 10);
  ctx.fillText('distance (m) →', PAD.l, H - 6);

  ctx.textAlign = 'left';
}

// ── Quaternion helpers ────────────────────────────────────────────────────────
function qinv([x,y,z,w]) { return [-x,-y,-z,w]; }
function qmul([x1,y1,z1,w1],[x2,y2,z2,w2]) {
  return [
    w1*x2 + x1*w2 + y1*z2 - z1*y2,
    w1*y2 - x1*z2 + y1*w2 + z1*x2,
    w1*z2 + x1*y2 - y1*x2 + z1*w2,
    w1*w2 - x1*x2 - y1*y2 - z1*z2,
  ];
}
function qdot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]; }
// Angular distance between two quaternions in degrees
function qdeg(a, b) { return 2 * Math.acos(Math.min(1, Math.abs(qdot(a,b)))) * 180/Math.PI; }
function qnorm(q) { const l = Math.hypot(...q); return q.map(v=>v/l); }

// ── Calibration state machine ─────────────────────────────────────────────────
// States: idle → waiting_still → calibrating → done
let calPhase    = 1;         // 1 = face net, 2 = face left
let calState    = 'idle';
let calRefQuat  = null;      // the averaged reference quaternion
let calSamples  = [];        // quaternions collected during calibration window
let calStart    = null;      // timestamp when calibration window began
let stillSince  = null;      // timestamp when phone became still
let lastCalQuat = null;
const CAL_DURATION   = 3000; // ms for calibration window
const STILL_REQUIRED = 500;  // ms phone must be still before starting
const STILL_THRESH   = 1.5;  // degrees/frame threshold to be considered "still"

function calTick(quat) {
  if (calState === 'idle') return;

  const now = performance.now();
  const pfx = calPhase === 1 ? 'cal' : 'cal2'; // event prefix

  // Stability detection
  const moving = lastCalQuat ? qdeg(lastCalQuat, quat) > STILL_THRESH : false;
  lastCalQuat = quat;

  if (calState === 'waiting_still') {
    if (moving) {
      stillSince = null;
    } else {
      if (!stillSince) stillSince = now;
      if (now - stillSince >= STILL_REQUIRED) {
        calState   = 'calibrating';
        calStart   = now;
        calSamples = [quat];
        socket.emit(`${pfx}_start`);
      }
    }
    return;
  }

  if (calState === 'calibrating') {
    if (moving) {
      calState   = 'waiting_still';
      stillSince = null;
      calSamples = [];
      socket.emit(`${pfx}_restart`);
      return;
    }

    const q0 = calSamples[0];
    calSamples.push(qdot(q0, quat) >= 0 ? quat : quat.map(v => -v));

    const pct = Math.min(1, (now - calStart) / CAL_DURATION);
    socket.emit(`${pfx}_progress`, { pct });

    if (pct >= 1) {
      const avg = [0,0,0,0];
      for (const q of calSamples) { avg[0]+=q[0]; avg[1]+=q[1]; avg[2]+=q[2]; avg[3]+=q[3]; }
      calRefQuat = qnorm(avg);
      calState   = 'done';
      socket.emit(`${pfx}_done`, { qref: calRefQuat });
      showCalBtn();
    }
  }
}

function showCalBtn() {
  if (calPhase === 1) {
    calPhase   = 2;
    calState   = 'waiting_still';
    stillSince = null;
    calSamples = [];
    lastCalQuat = currentQuat;
    socket.emit('cal2_waiting');
  }
  // Phase 2 done — both phases complete
}

// ── Sensor ────────────────────────────────────────────────────────────────────
let currentNormal = [0, 0, 1];
let currentQuat   = [0, 0, 0, 1];

const socket = io();

function onOrientation(normal, quat) {
  currentNormal = normal;
  currentQuat   = quat;

  calTick(quat);

  const azDeg  = Math.atan2(normal[0], normal[1]) * 180/Math.PI;
  const elDeg  = Math.asin(Math.max(-1, Math.min(1, normal[2]))) * 180/Math.PI;

  document.getElementById('qval').textContent =
    `[${quat.map(v => v.toFixed(3)).join(', ')}]`;
  document.getElementById('nval').textContent =
    `[${normal.map(v => v.toFixed(3)).join(', ')}]`;
  document.getElementById('azval').textContent = azDeg.toFixed(1) + '°';
  document.getElementById('elval').textContent = elDeg.toFixed(1) + '°';

  drawPhone(document.getElementById('phone3d'), normal, quat);
  drawParabola(document.getElementById('parabola'), normal);

  socket.emit('orientation', { normal, quat, az: azDeg, el: elDeg });
}

let sensorStarted = false;

async function startSensors() {
  document.getElementById('enable').style.display = 'none';

  // iOS permission
  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch { return setStatus('Permission denied', true); }
  }

  // Try AbsoluteOrientationSensor first (Android Chrome — gives quaternion directly)
  if ('AbsoluteOrientationSensor' in window) {
    try {
      if (navigator.permissions) {
        await Promise.all([
          navigator.permissions.query({ name: 'accelerometer' }),
          navigator.permissions.query({ name: 'gyroscope' }),
          navigator.permissions.query({ name: 'magnetometer' }),
        ]);
      }
      const sensor = new AbsoluteOrientationSensor({ frequency: 30 });
      sensor.addEventListener('reading', () => {
        // sensor.quaternion = [x,y,z,w]
        const q = sensor.quaternion;
        const normal = qrot(q, [0, 0, 1]);
        onOrientation(normal, [...q]);
      });
      sensor.addEventListener('error', e => setStatus('Sensor error: ' + e.error.message, true));
      sensor.start();
      sensorStarted = true;
      setStatus('AbsoluteOrientationSensor active', false);
      return;
    } catch (e) {
      console.warn('AbsoluteOrientationSensor failed, falling back:', e);
    }
  }

  // Fallback: deviceorientationabsolute
  window.addEventListener('deviceorientationabsolute', handler, true);
  window.addEventListener('deviceorientation', handler, true); // iOS fallback
  setStatus('deviceorientation active (fallback)', false);
}

function handler(e) {
  if (e.alpha == null) return;
  const normal = eulerToNormal(e.alpha, e.beta, e.gamma);
  // Approximate quaternion from euler for display
  const a = e.alpha*Math.PI/180, b = e.beta*Math.PI/180, g = e.gamma*Math.PI/180;
  const quat = [
    Math.sin(b/2)*Math.cos(g/2)*Math.cos(a/2) - Math.cos(b/2)*Math.sin(g/2)*Math.sin(a/2),
    Math.cos(b/2)*Math.sin(g/2)*Math.cos(a/2) + Math.sin(b/2)*Math.cos(g/2)*Math.sin(a/2),
    Math.cos(b/2)*Math.cos(g/2)*Math.sin(a/2) - Math.sin(b/2)*Math.sin(g/2)*Math.cos(a/2),
    Math.cos(b/2)*Math.cos(g/2)*Math.cos(a/2) + Math.sin(b/2)*Math.sin(g/2)*Math.sin(a/2),
  ];
  onOrientation(normal, quat);
}

function setStatus(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = err ? 'err' : 'ok';
}

socket.on('connect', () => setStatus('Connected to server ✓', false));
socket.on('disconnect', () => setStatus('Disconnected', true));

document.getElementById('enable').addEventListener('click', async () => {
  await startSensors();
  document.getElementById('cal-btn').style.display = 'inline-block';
});

function startCalPhase(btn, waitingEvent) {
  calState    = 'waiting_still';
  stillSince  = null;
  calSamples  = [];
  lastCalQuat = currentQuat;
  document.getElementById(btn).style.display = 'none';
  socket.emit(waitingEvent);
}

document.getElementById('cal-btn').addEventListener('click',
  () => startCalPhase('cal-btn', 'cal_waiting'));


// Initial draw
drawPhone(document.getElementById('phone3d'), [0, 0, 1], [0, 0, 0, 1]);
drawParabola(document.getElementById('parabola'), [0, 0, 1]);
</script>
</body>
</html>
